[project]
name = "clsg-script-engine"
version = "0.1.0"
description = "CLSG Script Engine – sinh kịch bản video bài giảng có trọng số theo chương"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "openai>=1.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
cli = ["typer>=0.9"]
app = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codebase/clsg"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
